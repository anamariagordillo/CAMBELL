{% extends "base.html" %}

{% block titulo %}Editar usuario - Cambell{% endblock %}

{% block contenido %}
    <section class="p60">
        <h2 class="mb5">Editar usuario</h2>
        <p class="txt-s mb30">ID: {{ usuario.id }} · Doc: {{ usuario.numero_documento|default:"-" }}</p>

        {% include "_mensajes.html" %}

        <form method="post" action="{% url 'panel_admin:editar_usuario' usuario.id %}" class="sup br8 p30 maxw520">
            {% csrf_token %}
            <label class="dblk txt-s fs12 fw600 mb6">Nombre completo</label>
            <input type="text" name="nombre" value="{{ usuario.nombre }}" required maxlength="100" class="campo txt-p p10 mb18 w100"/>

            <label class="dblk txt-s fs12 fw600 mb6">Correo electrónico</label>
            <input type="email" name="correo" value="{{ usuario.correo }}" required class="campo txt-p p10 mb18 w100"/>

            <label class="dblk txt-s fs12 fw600 mb6">Teléfono</label>
            <input type="text" name="telefono" value="{{ usuario.telefono|default_if_none:'' }}" pattern="[0-9]{7,15}" title="Solo números, entre 7 y 15 dígitos" class="campo txt-p p10 mb18 w100"/>

            <label class="dblk txt-s fs12 fw600 mb6">Rol</label>
            <select name="rol" class="campo txt-p p10 w100">
                {% for valor, etiqueta in roles %}
                    <option value="{{ valor }}" {% if usuario.rol == valor %}selected{% endif %}>{{ etiqueta }}</option>
                {% endfor %}
            </select>

            <button type="submit" class="btn-hero-principal wauto">Guardar cambios</button>
            <a href="{% url 'panel_admin:usuarios' %}" class="txt-nar ml10">Cancelar</a>
        </form>
    </section>
{% endblock %}
